# CD: build the image, smoke-test it, push it to ECR, then deploy to EC2 after a manual approval.
#
# The approval comes from the GitHub environment "production" (Settings -> Environments -> production
# -> Required reviewers). Setup steps: deploy/CD.md
name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC: GitHub gets short-lived AWS credentials, no access keys stored
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-north-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'get-well-ocr' }}
  # Not secret (the role's trust policy only lets this repo in). The repo variable overrides the default.
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN || 'arn:aws:iam::363183905530:role/gwo-github-deploy' }}

jobs:
  build:
    name: Build, test, push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gwo:ci .

      - name: Smoke test (API /health, Streamlit app)
        run: |
          docker run -d --name smoke-api -p 8000:8000 gwo:ci
          docker run -d --name smoke-app -p 8501:8501 -e APP_USERNAME=ci -e APP_PASSWORD=ci gwo:ci \
            streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
          check() {
            for _ in $(seq 1 30); do
              if curl -fsS "$2"; then echo; return 0; fi
              sleep 2
            done
            echo "::error::$1 did not become healthy"
            docker logs "$1"
            return 1
          }
          check smoke-api http://localhost:8000/health
          check smoke-app http://localhost:8501/_stcore/health

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push to ECR
        id: push
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:${GITHUB_SHA::7}"
          docker tag gwo:ci "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to EC2
    needs: build
    runs-on: ubuntu-latest
    # Waits here until a reviewer approves the deployment in GitHub
    environment: production
    # Only one deployment at a time; a newer run waits instead of cancelling a running one
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID || 'i-04b66c478838c965f' }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deploy script on the instance (SSM)
        run: |
          # Send deploy/remote-deploy.sh base64-encoded, so no quoting or SSM {{ }} placeholders get in the way
          jq -n \
            --arg header "base64 -d > /tmp/gwo-deploy.sh <<'GWO_EOF'" \
            --arg body "$(base64 -w 76 deploy/remote-deploy.sh)" \
            --arg run "IMAGE='$IMAGE' AWS_REGION='$AWS_REGION' bash /tmp/gwo-deploy.sh" \
            '{commands: ([$header] + ($body | split("\n")) + ["GWO_EOF", $run])}' > params.json

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "gwo deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for _ in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
                       --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Pending|InProgress|Delayed) sleep 10 ;;
              *) break ;;
            esac
          done

          echo "----- output from the instance -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text || true
          echo "------------------------------------"
          echo "Status: $STATUS"
          echo "Deployed \`$IMAGE\` to \`$INSTANCE_ID\`: **$STATUS**" >> "$GITHUB_STEP_SUMMARY"
          [ "$STATUS" = Success ]
