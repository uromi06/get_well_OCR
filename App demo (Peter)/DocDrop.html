<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="docdrop-server" content="no">
<title>DocDrop · Vom Papier in die Akte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231A5FD6'/%3E%3Cpath d='M20 14h17l9 9v27H20z' fill='%23ffffff'/%3E%3C/svg%3E">
<style>
/* DocDrop · calm, light, iOS like. One accent, quiet surfaces, clear states. Dark mode follows the system. */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--surface2:#F2F4F7;--line:#E4E7EC;--line2:#D0D5DD;
  --ink:#101828;--ink2:#475467;--ink3:#667085;
  --accent:#1A5FD6;--accent-ink:#FFFFFF;--accent-soft:#EAF1FD;--accent-line:#B9CFF5;
  --ok:#157F3C;--ok-soft:#ECFDF3;--ok-line:#ABEFC6;
  --warn:#B54708;--warn-soft:#FFFAEB;--warn-line:#FEDF89;
  --crit:#C4320A;--crit-soft:#FEF3F2;--crit-line:#FECDCA;
  --r:16px;--r-sm:12px;
  --shadow:0 1px 2px rgba(16,24,40,.05);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Roboto,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B0D12;--surface:#15181F;--surface2:#1C2029;--line:#262B36;--line2:#343B48;
  --ink:#F2F4F7;--ink2:#B4BCC8;--ink3:#8C95A4;
  --accent:#5B9BFF;--accent-ink:#06142E;--accent-soft:#16233D;--accent-line:#2B4A80;
  --ok:#47CD89;--ok-soft:#0F2A1D;--ok-line:#1E5A3B;
  --warn:#FDB022;--warn-soft:#2A2110;--warn-line:#5C4512;
  --crit:#F97066;--crit-soft:#2D1513;--crit-line:#6B2A24;
  --shadow:0 1px 2px rgba(0,0,0,.3);--shadow-lg:0 12px 32px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;padding-top:env(safe-area-inset-top,0px);overflow-x:clip}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* layout helpers */
.app{max-width:1180px;margin:0 auto;padding:0 0 calc(40px + env(safe-area-inset-bottom,0px))}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.eyebrow{font-size:13px;font-weight:600;color:var(--ink3);letter-spacing:0}
.h1{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1.12;letter-spacing:-.022em;margin:0}
.h2{font-family:var(--disp);font-weight:650;font-size:19px;line-height:1.25;letter-spacing:-.012em;margin:0}
.muted{color:var(--ink2);font-size:15px}
.tiny{font-size:13px;color:var(--ink3)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

/* surfaces and controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 16px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2);font-weight:600;font-size:15px;color:var(--ink);transition:transform .08s ease,background .15s ease,border-color .15s ease;text-align:center;box-shadow:var(--shadow)}
.btn:hover{background:var(--surface2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(16,24,40,.08),0 4px 12px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn.primary:hover{background:color-mix(in srgb,var(--accent) 88%,#000)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink2)}
.btn.ghost:hover{background:var(--surface2)}
.btn.danger{color:var(--crit);border-color:var(--crit-line);background:var(--surface)}
.btn.warn{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default;box-shadow:none}
.btn.primary[disabled]{background:var(--surface2);border-color:var(--line2);color:var(--ink3);opacity:1}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.chip.crit{color:var(--crit);background:var(--crit-soft);border-color:var(--crit-line)}
.chip.off{color:var(--ink3)}
.iconbtn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:var(--ink2);background:var(--surface);border:1px solid var(--line);flex:none;box-shadow:var(--shadow)}
.iconbtn:hover{background:var(--surface2)}
label.f{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 6px}
.inp{width:100%;min-height:44px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--ink);transition:border-color .15s ease,box-shadow .15s ease}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
textarea.inp{line-height:1.5;resize:vertical;font-size:15px}
select.inp{appearance:auto}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.ic.sm{width:16px;height:16px}
.banner{border-radius:var(--r-sm);padding:12px 14px;font-size:14px;border:1px solid;line-height:1.45}
.banner.info{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.banner.crit{background:var(--crit-soft);border-color:var(--crit-line)}
.banner.ok{background:var(--ok-soft);border-color:var(--ok-line)}

/* top bar and patient tabs */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.6) blur(16px);-webkit-backdrop-filter:saturate(1.6) blur(16px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.brand{font-family:var(--disp);font-weight:750;font-size:21px;letter-spacing:-.025em}
.brand::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--accent);margin-right:8px;vertical-align:2px}
.mode{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.mode.live{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.ptab{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 6px 4px 6px;border-radius:999px;background:var(--surface);border:1px solid var(--line);flex:none;max-width:260px;box-shadow:var(--shadow)}
.ptab .who{display:grid;text-align:left;line-height:1.15;min-width:0}
.ptab .who b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptab .who span{font-size:11.5px;color:var(--ink3)}
.ptab .x{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink3)}
.ptab .x:hover{background:var(--surface2)}
.ptab.on{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),var(--shadow)}
.ptab.add{min-height:40px;padding:0 14px;color:var(--accent);font-weight:600;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#0B1220;background:var(--pc);flex:none}
.pbanner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:inset 4px 0 0 var(--pc),var(--shadow)}
.pbanner{padding:10px 14px}
.pbanner .av{width:38px;height:38px;font-size:14px}
.pbanner b{font-size:16px;font-weight:650}

/* capture */
.bigscan{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:148px;width:100%;border-radius:20px;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 88%,#fff) 0%,var(--accent) 60%);color:var(--accent-ink);font-weight:700;font-size:19px;letter-spacing:-.01em;cursor:pointer;box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 28%,transparent);transition:transform .1s ease}
.bigscan:active{transform:scale(.985)}
.bigscan svg.ic{width:34px;height:34px;stroke-width:1.7;margin-bottom:2px}
.bigscan span{opacity:.85}
.pick{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:var(--r-sm);border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer;box-shadow:var(--shadow)}
.pick:hover{background:var(--surface2)}
.filein{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.page{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.page img{width:100%;height:100%;object-fit:cover;display:block}
.page button{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;background:rgba(16,24,40,.7);color:#fff;display:grid;place-items:center}
.doclist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.docrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;background:var(--surface);text-align:left;width:100%;border-top:1px solid var(--line)}
.docrow:first-child{border-top:none}
.docrow:hover{background:var(--surface2)}
.docic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.chev{color:var(--ink3);font-size:22px;line-height:1}
details>summary{list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";margin-left:auto;font-size:20px;color:var(--ink3);transition:transform .15s ease}
details[open]>summary::after{transform:rotate(90deg)}

/* pipeline */
.steps{display:flex;flex-direction:column;gap:2px}
.step{display:flex;align-items:flex-start;gap:12px;padding:9px 4px}
.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;border:2px solid var(--line2);color:var(--ink3);font-size:12px;margin-top:1px;background:var(--surface)}
.step.run .dot{border-color:var(--accent);border-top-color:transparent;animation:spin .8s linear infinite}
.step.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step.warn .dot{background:var(--warn);border-color:var(--warn);color:#fff}
.step.err .dot{background:var(--crit);border-color:var(--crit);color:#fff}
.step.skip{opacity:.5}
@keyframes spin{to{transform:rotate(360deg)}}

/* review */
.layout{display:grid;gap:16px}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}.layout .orig{position:sticky;top:140px}}
.orig img{width:100%;border-radius:12px;display:block;border:1px solid var(--line)}
.paper{background:#fff;color:#1D2939;border:1px solid var(--line);border-radius:12px;padding:16px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.orig .paper{max-height:72vh;overflow:auto}
.pgsep{font-family:var(--sans);font-size:11px;font-weight:700;color:#667085;border-top:1px dashed #D0D5DD;margin:8px 0 6px;padding-top:6px;text-transform:uppercase;letter-spacing:.06em}
.paper mark{background:#FFE58A;color:#101828;border-radius:3px;box-shadow:0 0 0 2px #FFE58A}
.gate{border-width:1px;box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}
.gate.match{box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
.gate.mismatch{border-color:var(--crit-line);background:var(--crit-soft);box-shadow:inset 4px 0 0 var(--crit),var(--shadow)}
.gate.unsure,.gate.unknown,.gate.new{box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}
.gate .big{font-size:17px;font-weight:700;letter-spacing:-.01em}
.idgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:14px;align-items:baseline}
.cmp .k{color:var(--ink3);font-size:12px}
.cmp .bad{color:var(--crit);font-weight:700}
.cmp .good{color:var(--ok);font-weight:700}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.field{display:flex;flex-direction:column;gap:10px}
.field.checked{border-color:var(--ok-line);box-shadow:inset 4px 0 0 var(--ok),var(--shadow)}
.field textarea{min-height:64px}
.field .notes{margin:0;padding-left:18px;font-size:13px;color:var(--warn)}
.check{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px;font-weight:600;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.sticky-actions{position:sticky;bottom:0;z-index:10;margin:0 -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;background:#101828;color:#fff;border-radius:14px;padding:11px 16px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;max-width:calc(100% - 32px);animation:pop .18s ease}
@media (prefers-color-scheme:dark){.toast{background:#F2F4F7;color:#101828}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}

/* modal */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.42);backdrop-filter:blur(2px);display:grid;place-items:end center}
@media(min-width:700px){.scrim{place-items:center}}
.modal{width:100%;max-width:520px;max-height:92dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
@media(min-width:700px){.modal{border-radius:22px}}

/* progress through the four phases */
.phases{display:flex;gap:6px;list-style:none;margin:0;padding:0}
.phases li{flex:1;text-align:center;font-size:12px;font-weight:600;color:var(--ink3);padding:0 2px 8px;position:relative}
.phases li::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:4px;background:var(--line)}
.phases li.done{color:var(--ink2)}
.phases li.done::after{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.phases li.cur{color:var(--accent)}
.phases li.cur::after{background:var(--accent)}

/* page list */
.iconbtn.sm{width:38px;height:38px;border-radius:10px}
.iconbtn[disabled]{opacity:.35;box-shadow:none}
.pagelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.pg{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface2)}
.pg.hint{border-color:var(--warn-line);background:var(--warn-soft)}
.pg.bad{border-color:var(--crit-line);background:var(--crit-soft)}
.pgimg{position:relative;width:68px;aspect-ratio:3/4;border-radius:8px;overflow:hidden;background:#fff;flex:none;display:grid;place-items:center;color:var(--crit);border:1px solid var(--line)}
.pgimg img{width:100%;height:100%;object-fit:cover}
.pgno{position:absolute;left:4px;top:4px;background:rgba(16,24,40,.78);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px}
.pgact{gap:6px;flex-wrap:wrap}
.inp.sm{min-height:40px;padding:8px 10px;font-size:15px}

/* extracted items */
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:flex-start;gap:10px;padding:6px;border-radius:12px;border:1px solid transparent}
.item input[type=checkbox]{width:22px;height:22px;margin-top:10px;accent-color:var(--accent);flex:none}
.item .inp{background:var(--surface2);border-color:transparent}
.item .inp:focus{background:var(--surface);border-color:var(--accent)}
.item.off .inp{opacity:.45;text-decoration:line-through}
.item.unsure{border-color:var(--warn-line);background:var(--warn-soft)}
.item.unsure .inp{background:var(--surface)}
.item.focus{outline:2px solid var(--accent);outline-offset:1px}
.item textarea.inp{resize:none;field-sizing:content;min-height:40px;line-height:1.35}
.chip.src{cursor:pointer;color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line);margin-top:8px}

/* check list */
.prio{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.prio li{display:flex;align-items:center;gap:10px;font-size:14px;padding:9px 12px;border-radius:12px;background:var(--surface2);border:1px solid var(--line)}
.prio li.crit{background:var(--crit-soft);border-color:var(--crit-line)}
.prio li.warn{background:var(--warn-soft);border-color:var(--warn-line)}
.prio li.info{color:var(--ink2)}

/* segmented control (text or photo) */
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface2);border:1px solid var(--line);border-radius:11px}
.seg button{min-height:32px;padding:0 14px;font-size:13px;font-weight:600;color:var(--ink2);border-radius:8px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.12)}

.backbtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--surface);border-color:var(--ink);box-shadow:var(--shadow-lg);border-radius:999px}
@media(min-width:960px){.backbtn{display:none}}
@media(max-width:560px){
  .sticky-actions .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sticky-actions .btn.primary{grid-column:1/-1;order:-1}
}

/* mixed stack */
.seglist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.segitem{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface2)}
.segitem.other{border-color:var(--crit-line);background:var(--crit-soft)}
.segno{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--accent-soft);color:var(--accent)}
.splitcard{box-shadow:inset 4px 0 0 var(--warn),var(--shadow)}

/* review on phones: summary and fields first, original below */
.rvsum{display:none}
@media(max-width:959px){
  .layout .orig{order:2}
  .rvsum{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .orig .paper{max-height:60vh}
}

</style>
</head>
<body>
<input class="filein" type="file" id="fileCam" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
<input class="filein" type="file" id="filePick" accept="image/jpeg,image/png,image/webp,image/heic,image/*" multiple aria-hidden="true" tabindex="-1">
<input class="filein" type="file" id="fileRetake" accept="image/*" capture="environment" aria-hidden="true" tabindex="-1">
<div class="app" id="app"></div>
<script>
/* DocDrop core v2: pure pipeline logic without DOM access.
   Purpose: document capture and verified transfer. No diagnosis, no therapy advice, no risk scores.
   Runs in the browser and in Node (tests). */
const Core = (() => {
  'use strict';

  const VERSION = { app: '0.5.0', schema: 'docdrop.v2', prompt: 'docdrop.analyze.v2', errors: 'docdrop.errors.v1' };

  /* ---------- categories: closed field lists ---------- */
  const CATS = {
    labor: { label: 'Laborbefund', subtypes: ['Blutbild', 'Klinische Chemie', 'Gerinnung', 'Urin', 'Sonstiges Labor'],
      fields: [['labor', 'Laborwerte', 'labs'], ['kommentar', 'Kommentar', 'text']] },
    arztbrief: { label: 'Arztbrief', subtypes: ['Entlassbrief', 'Verlegungsbrief', 'Ambulanter Befundbrief', 'Konsilbericht'],
      fields: [['diagnosen', 'Diagnosen', 'diagnoses'], ['anamnese', 'Anamnese / Historie', 'text'], ['befunde', 'Befunde', 'text'],
        ['verlauf', 'Therapie und Verlauf', 'text'], ['medikation', 'Medikation', 'meds'], ['labor', 'Laborwerte', 'labs'],
        ['procedere', 'Procedere / Empfehlungen', 'text']] },
    medplan: { label: 'Medikationsplan', subtypes: ['Bundeseinheitlicher Medikationsplan', 'Sonstiger Plan'],
      fields: [['medikation', 'Medikation', 'meds'], ['hinweise', 'Hinweise', 'text']] },
    bildgebung: { label: 'Bildgebung', subtypes: ['CT', 'MRT', 'Röntgen', 'Sonografie'],
      fields: [['fragestellung', 'Fragestellung', 'text'], ['befunde', 'Befund', 'text'], ['beurteilung', 'Beurteilung', 'text']] },
    opbericht: { label: 'OP Bericht', subtypes: ['OP Bericht', 'Interventionsbericht'],
      fields: [['diagnosen', 'Diagnosen', 'diagnoses'], ['eingriff', 'Durchgeführter Eingriff', 'text'], ['befunde', 'Befund und Verlauf', 'text'], ['procedere', 'Procedere', 'text']] },
    ueberweisung: { label: 'Überweisung', subtypes: ['Überweisung', 'Einweisung'],
      fields: [['diagnosen', 'Diagnosen', 'diagnoses'], ['fragestellung', 'Auftrag / Fragestellung', 'text']] },
    sonstiges: { label: 'Unklarer Dokumenttyp', subtypes: ['Sonstiges'],
      fields: [['inhalt', 'Inhalt', 'text']] }
  };
  const catOf = k => CATS[k] || CATS.sonstiges;
  const catKey = k => (CATS[k] ? k : 'sonstiges');
  const ASSERTION_LABEL = { confirmed: 'gesichert', suspected: 'Verdacht', excluded: 'ausgeschlossen', history: 'Vorgeschichte' };
  const LAB_STATE_LABEL = { value: 'Messwert', below_limit: 'unter Grenze', above_limit: 'über Grenze', qualitative: 'qualitativ', not_determined: 'nicht bestimmt', missing: 'fehlt', unparsed: 'unklar' };

  /* ---------- helpers ---------- */
  const str = v => (v == null ? '' : String(v)).trim();
  const DATE = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/;
  function parseDate(s) {
    const m = DATE.exec(str(s)); if (!m) return null;
    const d = +m[1], mo = +m[2], y = +m[3];
    const dt = new Date(Date.UTC(y, mo - 1, d));
    return dt.getUTCDate() === d && dt.getUTCMonth() === mo - 1 ? dt : null;
  }
  const pad = n => String(n).padStart(2, '0');
  const fmtDate = s => { const d = parseDate(s); return d ? pad(d.getUTCDate()) + '.' + pad(d.getUTCMonth() + 1) + '.' + d.getUTCFullYear() : str(s); };
  const fold = s => str(s).toLowerCase().normalize('NFC').replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss').replace(/μ/g, 'µ');
  const flat = s => fold(s).replace(/[^a-z0-9µ<>]+/g, '');
  const toNum = s => { const t = str(s).replace(/\s/g, '').replace(/[−–]/g, '-').replace(',', '.'); return /^[+-]?\d+(\.\d+)?$/.test(t) ? Number(t) : null; };
  const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  function hash(s) { let h = 0x811c9dc5; for (const c of flat(s)) { h ^= c.charCodeAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16).padStart(8, '0'); }

  /* ---------- page model and provenance ---------- */
  function joinPages(pages) {
    let off = 0; const idx = [];
    const parts = pages.map((t, i) => { idx.push({ page: i + 1, start: off, end: off + t.length }); off += t.length + 2; return t; });
    return { text: parts.join('\n\n'), idx };
  }
  function pageOf(doc, i) { const p = doc.idx.find(x => i >= x.start && i <= x.end); return p ? p.page : 1; }
  /* find a quote tolerant to whitespace and case; returns {page,start,end} or null */
  function locate(doc, needle) {
    const toks = str(needle).split(/\s+/).filter(Boolean).slice(0, 14);
    if (!toks.length) return null;
    const m = new RegExp(toks.map(escRe).join('\\s+'), 'i').exec(doc.text);
    if (!m) return null;
    return { page: pageOf(doc, m.index), start: m.index, end: m.index + m[0].length };
  }
  function lineAt(doc, i) { const a = doc.text.lastIndexOf('\n', i) + 1, b = doc.text.indexOf('\n', i); return { start: a, end: b < 0 ? doc.text.length : b, text: doc.text.slice(a, b < 0 ? undefined : b) }; }

  /* ---------- layer 1: cleaning (per page, before anything else) ---------- */
  function pageMarks(pages) {
    const marks = [];
    pages.forEach((t, i) => { const m = /seite\s+(\d+)\s*(?:von|\/)\s*(\d+)/i.exec(t); if (m) marks.push({ index: i + 1, printed: +m[1], total: +m[2] }); });
    return marks;
  }
  function clean(raw) {
    const changes = [];
    let t = str(raw).normalize('NFC').replace(/\r\n?/g, '\n').replace(/\t/g, '   ').replace(/ /g, ' ');
    const step = (re, rep, note) => { const b = t; t = t.replace(re, rep); if (t !== b) changes.push(note); };
    step(/([a-zäöüß])-\n([a-zäöüß])/g, '$1$2', 'Silbentrennung zusammengeführt');
    step(/(\d)[Oo](?=\d)/g, '$10', 'O in Zahlen zu 0');
    step(/(\d)[lI](?=\d)/g, '$11', 'l in Zahlen zu 1');
    step(/(\d[.,])[Oo](?=\d|\b)/g, '$10', 'O nach Dezimalzeichen zu 0');
    step(/[‐-―](?=\s?\d)/g, '-', 'Striche vor Zahlen vereinheitlicht');
    step(/−/g, '-', 'Minuszeichen vereinheitlicht');
    const b4 = t;
    t = t.split('\n').filter(l => !/^\s*seite\s+\d+\s*(von|\/)\s*\d+\s*$/i.test(l)).join('\n');
    if (t !== b4) changes.push('Seitenzahlzeilen entfernt');
    t = t.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n{3,}/g, '\n\n').trim();
    return { text: t, changes };
  }

  /* ---------- classification fallback ---------- */
  const KEYWORDS = {
    labor: [[/referenz/i, 3], [/laborbefund|laborgemeinschaft|laboratoriumsmedizin/i, 4], [/leukozyten|h[äa]moglobin|thrombozyten|crp|kreatinin/i, 2], [/mmol\/l|mg\/dl|g\/dl|\/nl/i, 2], [/probenentnahme|probeneingang|einsender/i, 2]],
    arztbrief: [[/entlass/i, 3], [/station[äa]r/i, 2], [/sehr geehrte/i, 2], [/epikrise|anamnese/i, 2], [/kollegial/i, 2], [/arztbrief|befundbrief|konsil/i, 3]],
    medplan: [[/medikationsplan/i, 6], [/morgens|mittags|abends|zur nacht/i, 2], [/wirkstoff|handelsname|st[äa]rke/i, 2]],
    bildgebung: [[/\bct\b|computertomograph/i, 3], [/\bmrt\b|magnetresonanz/i, 3], [/r[öo]ntgen|sonograph|sonografie/i, 3], [/kontrastmittel|schichtdicke/i, 2], [/radiolog/i, 3]],
    opbericht: [[/operationsbericht|op bericht|op-bericht/i, 6], [/operateur|narkose|hautschnitt|intraoperativ/i, 3]],
    ueberweisung: [[/[üu]berweisung|einweisung/i, 5], [/auftrag/i, 2]]
  };
  const MEDICAL = /patient|diagnose|befund|labor|therapie|arzt|ärzt|klinik|praxis|medikation|anamnese|untersuchung|referenz|\bgeb\.|mg\b|mmol|station/gi;
  const SUBTYPE_RULES = {
    arztbrief: [[/verleg/i, 'Verlegungsbrief'], [/konsil/i, 'Konsilbericht'], [/entlass|station[äa]r/i, 'Entlassbrief'], [/ambulan/i, 'Ambulanter Befundbrief']],
    labor: [[/blutbild|leukozyten|erythrozyten/i, 'Blutbild'], [/gerinnung|quick|inr|ptt/i, 'Gerinnung'], [/urin/i, 'Urin'], [/chemie|kreatinin|crp/i, 'Klinische Chemie']],
    bildgebung: [[/\bct\b|computertomograph/i, 'CT'], [/\bmrt\b|magnetresonanz/i, 'MRT'], [/sonograph|sonografie|ultraschall/i, 'Sonografie'], [/r[öo]ntgen/i, 'Röntgen']]
  };
  function subtypeFor(cat, text) {
    for (const [re, s] of SUBTYPE_RULES[cat] || []) if (re.test(text)) return s;
    return catOf(cat).subtypes[0];
  }
  function classifyLocal(text) {
    const scores = Object.entries(KEYWORDS).map(([cat, rules]) => [cat, rules.reduce((n, [re, w]) => n + (re.test(text) ? w : 0), 0)]).sort((a, b) => b[1] - a[1]);
    const [best, score] = scores[0], second = scores[1][1];
    const medicalHits = (str(text).match(MEDICAL) || []).length;
    const category = score >= 3 ? best : 'sonstiges';
    const confidence = score >= 3 ? Math.min(0.95, 0.5 + (score - second) / 12) : 0.3;
    return { category, subtype: subtypeFor(category, text), confidence: Math.round(confidence * 100) / 100, medical: medicalHits >= 2, source: 'regeln' };
  }

  /* ---------- patient identity ---------- */
  const NAMEPART = '(?!Geb|Geburt|Fall|Einsender|Pat\\b)[A-ZÄÖÜ][a-zäöüß]+(?:[ -](?!Geb|Geburt|Fall|Einsender|Probe)[A-ZÄÖÜ][a-zäöüß]+)?';
  const LABEL = '(?:Patient(?:in)?|Name|f[üu]r|Pat\\.)';
  function detectPatientLocal(text) {
    const t = str(text);
    let name = '';
    let m = new RegExp(LABEL + '\\s*:?\\s*(?:Herr|Frau)?\\s*(' + NAMEPART + ')\\s*,\\s*(' + NAMEPART + ')').exec(t);
    if (m) name = m[2] + ' ' + m[1];
    else if ((m = new RegExp(LABEL + '\\s*:?\\s*(?:Herr|Frau)?\\s*(' + NAMEPART + ')\\s+(' + NAMEPART + ')').exec(t))) name = m[1] + ' ' + m[2];
    const d = /(?:geb(?:oren)?\.?(?:\s*am)?|Geburtsdatum)\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})/i.exec(t);
    return { name: name.replace(/\s+/g, ' ').trim(), birthDate: d ? fmtDate(d[1]) : '' };
  }
  function detectDates(text, birthDate) {
    const pick = re => { const m = re.exec(text); return m ? fmtDate(m[1]) : ''; };
    let report = pick(/\b(?:Befunddatum|Berichtsdatum|Datum)\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})/i) || pick(/,\s*den\s+(\d{1,2}\.\d{1,2}\.\d{4})/i);
    if (!report) { const re = /(?:vom|am)\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4})/gi; let m; while ((m = re.exec(text))) { const v = fmtDate(m[1]); if (v !== birthDate) { report = v; break; } } }
    const st = /(?:Probenentnahme|Abnahme|Entnahme|Probeneingang)\s*:?\s*(\d{1,2}\.\d{1,2}\.\d{4}(?:\s+\d{1,2}:\d{2})?)/i.exec(text);
    return { reportDate: report, sampleTime: st ? st[1].replace(/\s+/g, ' ') : '' };
  }
  /* strict identity check: a match needs the same birth date and the same name after normalization */
  const nameKey = n => fold(n).replace(/\b(dr|med|prof|herr|frau)\b\.?/g, ' ').replace(/ae/g, 'a').replace(/oe/g, 'o').replace(/ue/g, 'u').replace(/[^a-z ]+/g, ' ').split(/\s+/).filter(x => x.length > 1).sort().join(' ');
  function lev(a, b) {
    const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
    for (let j = 1; j <= b.length; j++) d[0][j] = j;
    for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++) d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d[a.length][b.length];
  }
  function comparePatient(found, patient) {
    const a = nameKey(found?.name), b = nameKey(patient?.name);
    const sim = a && b ? 1 - lev(a, b) / Math.max(a.length, b.length) : null;
    const dobA = fmtDate(found?.birthDate), dobB = fmtDate(patient?.birthDate);
    const dobKnown = !!(parseDate(dobA) && parseDate(dobB));
    const dobSame = dobKnown && dobA === dobB, nameSame = !!a && a === b;
    if (sim === null && !dobKnown) return { result: 'unknown', sim, nameSame, dobSame, reason: 'Weder Name noch Geburtsdatum erkannt' };
    if (dobKnown && !dobSame) return { result: 'mismatch', sim, nameSame, dobSame, reason: 'Geburtsdatum unterscheidet sich' };
    if (sim !== null && sim < 0.6) return { result: 'mismatch', sim, nameSame, dobSame, reason: 'Name unterscheidet sich' };
    if (dobSame && nameSame) return { result: 'match', sim, nameSame, dobSame };
    return { result: 'unsure', sim, nameSame, dobSame, reason: !dobKnown ? 'Nur ein Merkmal vergleichbar, Geburtsdatum fehlt' : 'Name nur ähnlich, nicht gleich' };
  }
  function findPatient(found, patients) {
    for (const p of patients || []) { const c = comparePatient(found, p); if (c.result === 'match') return { patient: p, cmp: c }; }
    return null;
  }

  /* ---------- statement type (assertion) ---------- */
  const ASSERT = [
    ['excluded', /\b(ausgeschlossen|ausschluss|kein(?:e|en)?\s+(?:hinweis|nachweis|anhalt)|nicht\s+nachweisbar)\b/i],
    ['suspected', /(\bv\.\s?a\.|\bverdacht\s+auf\b|\bfraglich\b|\bdd\b|\bdifferentialdiagnos)/i],
    ['history', /(\bz\.\s?n\.|\bzustand\s+nach\b|\bst\.\s?p\.|\bstatus\s+post\b|\bin\s+der\s+vorgeschichte\b|\banamnestisch\b)/i]
  ];
  const assertionOf = t => { for (const [k, re] of ASSERT) if (re.test(t)) return k; return 'confirmed'; };

  /* ---------- lab values ---------- */
  const QUAL = /^(negativ|positiv|neg\.?|pos\.?|normal|unauff[äa]llig|nachweisbar|nicht nachweisbar|spuren?|\+{1,3}|-)$/i;
  const NOTDET = /^(n\.?\s?b\.?|nicht bestimmt|nicht durchgef[üu]hrt|entf[äa]llt|folgt|s\.\s?u\.)$/i;
  function parseLabValue(raw) {
    const r = str(raw).replace(/\s+/g, ' ');
    if (!r) return { state: 'missing', comparator: '', num: null };
    if (NOTDET.test(r)) return { state: 'not_determined', comparator: '', num: null };
    if (QUAL.test(r)) return { state: 'qualitative', comparator: '', num: null };
    let m = /^(<=|>=|≤|≥|<|>)\s*([+\-−]?\d+(?:[.,]\d+)?)$/.exec(r);
    if (m) { const c = m[1].replace('≤', '<=').replace('≥', '>='); return { state: c.startsWith('<') ? 'below_limit' : 'above_limit', comparator: c, num: toNum(m[2]) }; }
    const n = toNum(r);
    if (n !== null) return { state: 'value', comparator: '', num: n };
    return { state: 'unparsed', comparator: '', num: null };
  }
  const normUnit = u => str(u).replace(/μ/g, 'µ').replace(/\bmcg\b/gi, 'µg').replace(/\/dl\b/gi, '/dL').replace(/^ml\//, 'mL/');
  const REFRANGE = /^([+\-−]?\d+(?:[.,]\d+)?)\s*[-–]\s*([+\-−]?\d+(?:[.,]\d+)?)$/;
  const REFLIM = /^(<=|>=|<|>|≤|≥)\s*([+\-−]?\d+(?:[.,]\d+)?)$/;
  const FLAG = /^(H|L|HH|LL|\+|\+\+|↑|↓)$/;
  function flagFrom(state, num, ref) {
    if (state !== 'value' || num === null || !ref) return '';
    let m = REFRANGE.exec(str(ref));
    if (m) { const lo = toNum(m[1]), hi = toNum(m[2]); return num < lo ? 'L' : num > hi ? 'H' : ''; }
    if ((m = REFLIM.exec(str(ref)))) { const lim = toNum(m[2]); return m[1].startsWith('<') || m[1] === '≤' ? (num >= lim ? 'H' : '') : (num <= lim ? 'L' : ''); }
    return '';
  }
  function makeLab(name, rawValue, unit, ref, flag) {
    const p = parseLabValue(rawValue);
    return { name: str(name), rawValue: str(rawValue), comparator: p.comparator, num: p.num, state: p.state, unit: str(unit), unitNorm: normUnit(unit), ref: str(ref).replace(/\s+/g, ' '), flag: str(flag) || flagFrom(p.state, p.num, ref), notes: [] };
  }
  function parseLabLine(line) {
    const l = line.trim();
    if (!l || /^(parameter|analyt|untersuchung|test)\b/i.test(l)) return null;
    if (/seite\s+\d+\s*(von|\/)\s*\d+/i.test(l)) return null;
    let toks = l.split(/\s{2,}/).map(x => x.trim()).filter(Boolean);
    const word = /^(.+?)\s+(n\.\s?b\.|nicht bestimmt|nicht durchgef[üu]hrt|negativ|positiv|nicht nachweisbar|nachweisbar)(?:\s+(.*))?$/i.exec(l);
    if (toks.length < 2 && word) {
      const rest = (word[3] || '').trim();
      const rm = /((?:<=|>=|<|>)\s*[+\-−]?\d+(?:[.,]\d+)?|[+\-−]?\d+(?:[.,]\d+)?\s*[-–]\s*[+\-−]?\d+(?:[.,]\d+)?|negativ|positiv)\s*(H|L)?$/i.exec(rest);
      toks = [word[1], word[2], rm ? rest.slice(0, rm.index).trim() : rest, rm ? rm[1] : '', rm?.[2] || ''].filter((x, i) => i < 2 || x);
    } else if (toks.length < 2) {
      const m = /^([A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß0-9 .()\/-]{1,40}?)\s+((?:<=|>=|<|>)?\s*[+\-−]?\d+(?:[.,]\d+)?)\s*([^\s\d][^\s]*)?\s*((?:[<>]\s*)?[+\-−]?\d+(?:[.,]\d+)?(?:\s*[-–]\s*[+\-−]?\d+(?:[.,]\d+)?)?)?\s*(H|L|HH|LL|\+)?$/.exec(l);
      if (!m) return null;
      toks = [m[1], m[2], m[3] || '', m[4] || '', m[5] || ''].filter((x, i) => i < 2 || x);
    }
    const [name, value, ...rest] = toks;
    if (!/[a-zäöü]/i.test(name) || name.includes(':') || DATE.test(name)) return null;
    if (parseLabValue(value).state === 'unparsed') return null;
    let unit = '', ref = '', flag = '';
    const valueQual = QUAL.test(value);
    for (const t of rest) {
      if (FLAG.test(t)) flag = t;
      else if (REFRANGE.test(t) || REFLIM.test(t) || (valueQual && QUAL.test(t))) ref = t;
      else if (!unit) unit = t;
    }
    return makeLab(name, value, unit, ref, flag);
  }

  /* ---------- sections and local extraction ---------- */
  const HEADINGS = [
    ['diagnosen', /^((haupt|neben|entlass|aufnahme)\s*)?diagnose(n)?\b/i],
    ['anamnese', /^((eigen|jetzige|aktuelle|fremd)\s*)?anamnese\b|^vorgeschichte|^vorerkrankungen|^patientenhistorie/i],
    ['medikation', /^((entlass|aktuelle|empfohlene)\s*)?medikation\b|^entlassmedikation|^medikamente\b/i],
    ['labor', /^labor(werte|befund)?\b/i],
    ['verlauf', /^((therapie und|station[äa]rer|klinischer)\s*)?verlauf\b|^therapie\b|^epikrise/i],
    ['procedere', /^procedere|^empfehlung(en)?\b|^weiteres vorgehen|^therapieempfehlung|^weiterbehandlung/i],
    ['fragestellung', /^fragestellung|^klinische angaben|^indikation\b|^auftrag\b/i],
    ['beurteilung', /^beurteilung|^zusammenfassung|^impression/i],
    ['eingriff', /^eingriff\b|^durchgef[üu]hrte operation|^operation\b/i],
    ['befunde', /^((aufnahme|untersuchungs|klinischer?|k[öo]rperliche[rn]?)\s*)?befund(e)?\b/i],
    ['hinweise', /^hinweise?\b/i],
    ['kommentar', /^kommentar|^bemerkung/i],
    ['technik', /^technik\b|^untersuchungstechnik|^methode\b/i]
  ];
  function headingOf(line) {
    const l = line.trim();
    if (!l || l.length > 60) return null;
    const colon = /^[^:]{2,45}:/.test(l);
    const head = colon ? l.slice(0, l.indexOf(':')) : l;
    if (!colon && l.split(/\s+/).length > 5) return null;
    for (const [key, re] of HEADINGS) if (re.test(head.trim())) return { key, label: head.trim(), rest: colon ? l.slice(l.indexOf(':') + 1).trim() : '' };
    return null;
  }
  function sections(text) {
    const out = { _head: [] }; let cur = '_head';
    for (const line of str(text).split('\n')) {
      if (/^\s*(mit freundlichen|mfg\b|hochachtungsvoll|viele gr[üu][ßs]e)/i.test(line)) { cur = '_tail'; continue; }
      if (cur !== '_head' && /^\s*(dr\.\s*med\.|prof\.\s*dr|facharzt|fach[äa]rztin)/i.test(line) && line.trim().split(/\s+/).length < 10) { cur = '_tail'; continue; }
      const h = headingOf(line);
      if (h) { cur = h.key; (out[cur] = out[cur] || []).push({ heading: h.label }); if (h.rest) out[cur].push(h.rest); continue; }
      (out[cur] = out[cur] || []).push(line);
    }
    return out;
  }
  const lines = arr => (arr || []).filter(x => typeof x === 'string').map(x => x.trim()).filter(Boolean);
  const stripBullet = l => l.replace(/^\s*(?:[-•*·]|\d{1,2}[.)])\s+/, '').trim();
  const ICD = /\(?\b([A-TV-Z]\d{2}(?:\.\d{1,2})?[GVZABLR]?)\b\)?/;
  function parseDiagnoses(items) {
    const out = [];
    for (const it of items || []) {
      if (typeof it !== 'string') continue;
      const l = stripBullet(it); if (!l || /^sehr geehrte/i.test(l)) continue;
      const m = ICD.exec(l);
      out.push({ text: l.replace(ICD, '').replace(/[\s,;:]+$/, '').trim(), icd: m ? m[1] : '', assertion: assertionOf(l), quote: l });
    }
    return out;

let toastT = null, armT = null;

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const t = ev.target.closest('[data-act]'); if (!t || t.disabled) return;
  if (t.dataset.act === 'modal-close' && ev.target.closest('[data-stop]') && !ev.target.closest('button[data-act="modal-close"]')) return;
  const a = t.dataset.act, v = t.dataset.v, R = S.rv;
  switch (a) {
    case 'settings': S.cfgDraft = { ...S.cfg, apiKey: session.apiKey, access: session.access }; S.testMsg = null; S.modal = 'settings'; render(); break;
    case 'modal-close': S.modal = null; render(); break;
    case 'tab': S.active = v; if (S.screen === 'doc') S.screen = 'home'; persistMeta(); render(); break;
    case 'tab-close': closeTab(v); break;
    case 'home': S.screen = 'home'; S.editSec = null; render(); break;
    case 'patient-new': S.np = { name: '', birthDate: '', tried: false }; S.modal = 'patient'; render(); break;
    case 'patient-new-from': S.np = { name: R?.idEdit.name || '', birthDate: R?.idEdit.birthDate || '', tried: false }; S.modal = 'patient'; render(); break;
    case 'np-save': { const n = S.np; n.tried = true; if (validIdentity(n.name, n.birthDate)) { render(); break; } const hit = Core.findPatient(n, S.patients); if (hit) openTab(hit.patient.id); else createPatient(n.name, n.birthDate); S.modal = null; if (S.screen === 'doc') S.screen = 'home'; render(); break; }
    case 'np-pick': openTab(v); S.modal = null; if (S.screen === 'doc') S.screen = 'home'; render(); break;
    case 'sample': { const s = Core.SAMPLES.find(x => x.id === v); S.cap = { ...newCap(), pages: s.pages.map(renderPaper), sampleId: s.id }; saveDraft(); render(); break; }
    case 'page-del': pagesChanged(); ORIGINALS.delete(v); S.cap.pages = S.cap.pages.filter(p => p.id !== v); if (!S.cap.pages.length) S.cap.sampleId = null; saveDraft(); render(); break;
    case 'page-up': { const P = S.cap.pages, i = P.findIndex(p => p.id === v); if (i > 0) { [P[i - 1], P[i]] = [P[i], P[i - 1]]; pagesChanged(); saveDraft(); render(); } break; }
    case 'page-rot': { pagesChanged(); const pp = S.cap.pages.find(x => x.id === v); if (pp) delete pp.ocr; rotatePage(v); break; }
    case 'page-retake': S.retake = v; document.getElementById('fileRetake').click(); break;
    case 'cap-clear': if (armed('capclear', 'Seiten verwerfen?')) { keepOriginals(); await dropDraft(); render(); } break;
    case 'nscan': nativeScan(); break;
    case 'run': runJob(); break;
    case 'split-apply': {
      const c = S.cap, segs = c.split.segments, n = segs.length;
      const parts = segs.map((g, k) => ({ ...newCap(), sampleId: c.sampleId, single: true, pages: g.pages.map(i => c.pages[i]), fromStack: { n: k + 1, of: n, label: g.label, name: g.patient.name } }));
      S.cap = parts[0]; S.queue = [...parts.slice(1), ...S.queue]; await saveQueue(); runJob(); break;
    }
    case 'split-ignore': S.cap.single = true; S.cap.split = null; runJob(); break;
    case 'queue-next': if (S.cap.pages.length || S.cap.text.trim() || S.rv) break; S.cap = S.queue.shift(); await saveQueue(); runJob(); break;
    case 'queue-drop': if (armed('qdrop', 'Restliche Dokumente aus dem Stapel verwerfen?')) { S.queue = []; await saveQueue(); keepOriginals(); render(); } else render(); break;
    case 'run-abort': S.job?.ctl.abort(); break;
    case 'run-back': S.job = null; S.screen = 'home'; render(); break;
    case 'back-capture': S.screen = 'home'; S.rv = null; saveDraft(); render(); toast('Seiten ergänzen oder ersetzen, dann neu auswerten.'); break;
    case 'goto-gate': document.getElementById('gate')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); break;

    case 'goto-type': document.getElementById('type')?.scrollIntoView({ block: 'center', behavior: 'smooth' }); break;

    case 'gate-open': openTab(v); R.ack = false; render(); window.scrollTo(0, 0); break;
    case 'gate-create': { const err = validIdentity(R.idEdit.name, R.idEdit.birthDate); if (err) { toast(err); break; } createPatient(R.idEdit.name, R.idEdit.birthDate); R.ack = false; render(); window.scrollTo(0, 0); break; }
    case 'focus': case 'src': jump(t.dataset.k, t.dataset.i); break;
    case 'back-field': { const id = R.back; R.back = null; R.hl = null; render(); requestAnimationFrame(() => { const n = document.getElementById(id); n?.scrollIntoView({ block: 'center', behavior: 'smooth' }); n?.querySelector('input.inp,textarea')?.focus({ preventScroll: true }); }); break; }
    case 'pane': R.pane = v; render(); break;
    case 'copy-sec': { if (!confirmed()) break; const label = Core.catOf(R.category).fields.find(f => f[0] === v)[1]; if (await copyText(sectionOut(R, v))) { R.checked[v] = true; saveDraft(); toast(label + ' kopiert und als geprüft markiert.'); } else toast('Kopieren nicht möglich.'); break; }
    case 'copy-checked': { if (!confirmed()) break; const p = activePatient(), def = Core.catOf(R.category);
      const txt = 'Patient: ' + p.name + ', geb. ' + p.birthDate + '\nDokument: ' + def.label + ' (' + R.subtype + ')' + (R.reportDate ? ' vom ' + R.reportDate : '') + '\n\n' + def.fields.filter(([k]) => R.checked[k] && sectionOut(R, k)).map(([k, l]) => l + ':\n' + sectionOut(R, k)).join('\n\n');
      toast(await copyText(txt) ? 'Markierte Abschnitte kopiert.' : 'Kopieren nicht möglich.'); break; }
    case 'rv-save': saveReview(); break;
    case 'rv-discard': if (armed('discard', 'Prüfung verwerfen? Es wird nichts übernommen.')) { keepOriginals(); await dropDraft(); S.screen = 'home'; render(); } else render(); break;
    case 'doc-open': S.docId = v; S.screen = 'doc'; S.editSec = null; render(); window.scrollTo(0, 0); break;
    case 'doc-copy': { const d = S.docs.find(x => x.id === S.docId); toast(await copyText(d.sections[+v].text) ? 'Kopiert.' : 'Kopieren nicht möglich.'); break; }
    case 'doc-copy-all': { const d = S.docs.find(x => x.id === S.docId), p = patientById(d.patientId); toast(await copyText('Patient: ' + p.name + ', geb. ' + p.birthDate + '\nDokument: ' + d.label + ' (' + d.subtype + ')' + (d.reportDate ? ' vom ' + d.reportDate : '') + '\n\n' + d.sections.map(s => s.label + ':\n' + s.text).join('\n\n')) ? 'Alles kopiert.' : 'Kopieren nicht möglich.'); break; }
    case 'doc-edit': S.editSec = +v; render(); break;
    case 'doc-edit-cancel': S.editSec = null; render(); break;
    case 'doc-edit-save': {
      const d = S.docs.find(x => x.id === S.docId), s = d.sections[+v], after = document.querySelector('[data-docedit]').value.trim();
      if (after === s.text) { S.editSec = null; render(); break; }
      const next = S.docs.map(x => x.id !== d.id ? x : { ...x, sections: x.sections.map((y, j) => j === +v ? { ...y, text: after, corrected: true } : y), revisions: [...(x.revisions || []), { at: Date.now(), role: S.cfg.role, reviewer: S.cfg.reviewer, key: s.key, label: s.label, before: s.text, after }] });
      try { await Store.setStrict('docs', next); S.docs = next; S.editSec = null; render(); toast('Korrektur mit Nachweis gespeichert.'); } catch { toast(Core.errInfo('save_failed').text); }
      break;
    }
    case 'doc-del': if (armed('del', 'Dokument endgültig löschen?')) { const next = S.docs.filter(d => d.id !== S.docId); try { await Store.setStrict('docs', next); S.docs = next; S.screen = 'home'; render(); toast('Gelöscht.'); } catch { toast(Core.errInfo('save_failed').text); } } else render(); break;
    case 'cfg-test': {
      const old = S.cfg, oldS = { ...session }; S.cfg = { ...S.cfgDraft }; session.apiKey = S.cfgDraft.apiKey; session.access = S.cfgDraft.access; S.testMsg = { kind: 'info', text: 'Teste …' }; render();
      try { const st = await AI.status(); S.testMsg = st.llm === false ? { kind: 'warn', text: 'Server erreichbar, Modell antwortet nicht. ' + (st.error || '') } : { kind: 'ok', text: 'Verbunden.' + (st.models?.length ? ' Modelle: ' + st.models.slice(0, 6).join(', ') : '') }; }
      catch (e) { const i = Core.errInfo(e.code); S.testMsg = { kind: 'crit', text: i.text + ' ' + i.action }; }
      S.cfg = old; session = oldS; render(); break;
    }
    case 'cfg-save': { const { apiKey, access, ...cfg } = S.cfgDraft; S.cfg = { ...DEFAULT_CFG, ...cfg }; if (PUBLIC && !['demo', 'fake'].includes(S.cfg.mode)) S.cfg.mode = 'fake'; session.apiKey = apiKey || ''; session.access = access || ''; saveSession(); S.modal = null; persistMeta(); render(); toast('Gespeichert.'); break; }
    case 'diag-copy': toast(await copyText(Diag.export()) ? 'Diagnose kopiert (nur technische Daten).' : 'Kopieren nicht möglich.'); break;
    case 'release': ORIGINALS.clear(); S.queue = []; await saveQueue(); await dropDraft(); S.open = []; S.active = null; session = { apiKey: '', access: '' }; saveSession(); S.modal = null; S.screen = 'home'; persistMeta(); render(); toast('Gerät freigegeben.'); break;
    case 'wipe': if (armed('wipe', 'Alle Akten und Dokumente auf diesem Gerät löschen?')) { ORIGINALS.clear(); await Store.clear(); Object.assign(S, { patients: [], docs: [], open: [], active: null, rv: null, queue: [], cap: newCap(), screen: 'home', modal: null, cfg: { ...DEFAULT_CFG } }); render(); toast('Alle Daten gelöscht.'); } else render(); break;
  }
});
document.addEventListener('input', e => {
  const d = e.target.dataset, R = S.rv;
  if (d.captext !== undefined) { const had = !!S.cap.text.trim(); S.cap.text = e.target.value; saveDraft(); if (had !== !!S.cap.text.trim()) render(); }
  if (d.edit && R) { (R.edits[d.edit] = R.edits[d.edit] || {})[d.i] = e.target.value; saveDraft(); }
  if (d.rv && R) { R[d.rv] = e.target.value; saveDraft(); }
  if (d.id && R) { R.idEdit[d.id] = e.target.value; R.confirmedFor = null; R.ack = false; R.forced = false; saveDraft(); render(); }
  if (d.np && S.np) S.np[d.np] = e.target.value;
  if (d.cfg && S.cfgDraft) S.cfgDraft[d.cfg] = e.target.value;
});
document.addEventListener('change', e => {
  const d = e.target.dataset, R = S.rv;
  if (d.chk && R) { R.checked[d.chk] = e.target.checked; saveDraft(); render(); }
  if (d.inc && R) { R.include[d.inc][+d.i] = e.target.checked; saveDraft(); render(); }
  if (d.ack !== undefined && R) { R.ack = e.target.checked; render(); }
  if (d.cat !== undefined && R) changeCategory(e.target.value);
  if (d.sub !== undefined && R) { R.subtype = e.target.value; saveDraft(); }
  if (d.cfgmode !== undefined && S.cfgDraft) { S.cfgDraft.mode = e.target.value; S.testMsg = null; render(); }
  if (d.cfgsel && S.cfgDraft) S.cfgDraft[d.cfgsel] = e.target.value;
  if (d.cfgnothink !== undefined && S.cfgDraft) S.cfgDraft.noThink = e.target.checked;
});
document.addEventListener('toggle', e => { if (e.target.matches?.('details[data-gate]') && S.rv) S.rv.showId = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.modal) { S.modal = null; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('label[role=button]')) { e.preventDefault(); e.target.click(); }
});
for (const id of ['fileCam', 'filePick']) document.getElementById(id).addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('fileRetake').addEventListener('change', e => { const id = S.retake; S.retake = null; addFiles(e.target.files, id); e.target.value = ''; });
window.addEventListener('pageshow', e => { if (e.persisted && S.job && !S.job.err) { S.job.ctl.abort(); } });

/* ---------- boot ---------- */
(async function boot() {
  render();
  const [patients, docs, tabs, cfg, draft, diag] = await Promise.all(['patients', 'docs', 'tabs', 'cfg', 'draft', 'diag'].map(k => Store.get(k)));
  S.patients = Array.isArray(patients) ? patients : [];
  S.docs = Array.isArray(docs) ? docs.filter(d => d.sections) : [];
  S.open = (tabs?.open || []).filter(id => S.patients.some(p => p.id === id));
  S.active = S.open.includes(tabs?.active) ? tabs.active : S.open[0] || null;
  if (cfg) S.cfg = { ...DEFAULT_CFG, ...cfg };
  else if (document.querySelector('meta[name=docdrop-server]')?.content === 'yes') S.cfg.mode = 'server';
  else if (NATIVE) S.cfg.mode = 'native';
  else if (PUBLIC) S.cfg.mode = 'fake';
  if (PUBLIC && !['demo', 'fake'].includes(S.cfg.mode)) S.cfg.mode = 'fake';
  if (!NATIVE && S.cfg.mode === 'native') S.cfg.mode = 'demo';
  if (diag?.counts) Diag.data = { events: diag.events || [], counts: { ...Diag.data.counts, ...diag.counts } };
  const queue = await Store.get('queue');
  if (queue?.items?.length) { if (Date.now() - queue.savedAt > DRAFT_TTL) await Store.del('queue'); else S.queue = queue.items; }
  if (draft && draft.v === 2) {
    if (Date.now() - draft.savedAt > DRAFT_TTL) await Store.del('draft');
    else {
      S.cap = draft.cap || newCap();
      if (draft.running) { S.interrupted = true; S.screen = 'home'; } // never pretend a job is still running
      else if (draft.rv) { S.rv = draft.rv; S.rv.confirmedFor = null; S.rv.ack = false; S.rv.forced = false; S.screen = 'review'; toast('Entwurf von ' + hhmm(draft.savedAt) + ' wiederhergestellt. Patient bitte erneut bestätigen.'); }
      else if (S.cap.pages.length || S.cap.text) S.draftNote = 'Entwurf von ' + hhmm(draft.savedAt) + ' wiederhergestellt.';
    }
  }
  S.offline = navigator.onLine === false;
  S.ready = true; render();
  addEventListener('online', () => { S.offline = false; render(); });
  addEventListener('offline', () => { S.offline = true; render(); });
  // app shell for the home screen app; only in the server build (manifest present) and only on a secure origin
  if (canInstall() && 'serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => Diag.log({ kind: 'sw', code: 'register_failed' }));
})();

</script>
